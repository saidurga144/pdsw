[build]
  command = "npm install --include=dev --legacy-peer-deps && cd frontend && npm install --include=dev --legacy-peer-deps && npm run build"
  publish = "frontend/.next"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss: ws:; frame-ancestors 'self' https://saikumardungala.netlify.app http://localhost:3000; base-uri 'self'; form-action 'self'"
