services:
  - type: web
    name: pdsw-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_DATABASE
        value: pdsw
      - key: MONGODB_TIMEOUT_MS
        value: "5000"
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: SEPOLIA_CHAIN_ID
        value: "11155111"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: "System Administrator"
      - key: BOOTSTRAP_ADMIN_SECRET
        sync: false

  - type: web
    name: pdsw-pinata
    runtime: node
    region: oregon
    plan: free
    rootDir: pinata
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ipfs/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PINATA_JWT
        sync: false
      - key: MAX_FILE_SIZE_MB
        value: "15"
      - key: ALLOWED_ORIGINS
        value: https://pdsw.netlify.app
